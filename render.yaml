# ============================================================
#  Render.com uchun sozlama (Blueprint)
#  https://render.com/docs/blueprint-spec
#
#  Render bu faylni o'qib, xizmatni avtomatik sozlaydi.
#  sync: false bo'lgan qiymatlarni Render o'zi so'raydi —
#  ular hech qachon repozitoriyga yozilmaydi.
# ============================================================
services:
  - type: web
    name: autoxabar
    runtime: python
    plan: free
    region: frankfurt          # O'zbekistonga eng yaqin mintaqa
    branch: main
    buildCommand: pip install -r requirements.txt
    # Bitta ishchi jarayon: fon vazifalari (yuborish sikli, avto-to'lov)
    # takrorlanmasligi uchun MUHIM. Parallellik threads orqali beriladi.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /

    # !!! TO'LOV QABUL QILISHDAN OLDIN OQILISHI SHART !!!
    # `plan: free` da doimiy disk yo'q: SQLite bazasi har deployda va
    # har uyqudan uyg'onishda nolga tushadi - to'lovlar, obunalar va
    # foydalanuvchilar yo'qoladi. Haqiqiy pul qabul qilishdan oldin
    # pullik tarifga o'ting va quyidagini yoqing (DATA_DIR bilan birga):
    #
    # disk:
    #   name: autoxabar-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # ... va envVars ga: - key: DATA_DIR / value: /var/data

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # --- Xavfsizlik ---
      - key: SECRET_KEY
        generateValue: true    # Render tasodifiy kalit yaratadi
      - key: FLASK_DEBUG
        value: "0"

      # --- Fon vazifalari ---
      - key: RUN_SCHEDULER
        value: "1"

      # Render ham reverse-proxy orqasida ishlaydi: haqiqiy mijoz IP si
      # X-Forwarded-For dan olinadi (audit jurnali uchun).
      - key: TRUSTED_PROXIES
        value: "1"

      # --- Admin (Render so'raydi) ---
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Administrator"

      # --- Telegram (Render so'raydi) ---
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_ENGINE
        value: "auto"

      # --- Narx va moliya ---
      - key: PRICE_PER_PROFILE
        value: "5000"
      - key: TAX_PERCENT
        value: "10"
      - key: ACQUIRING_PERCENT
        value: "1.0"
      - key: TRIAL_DAYS
        value: "3"

      # --- Click (Render so'raydi, repozitoriyga yozilmaydi) ---
      # Click merchant kabinetidagi servis sozlamalariga qo'yiladigan manzillar:
      #   Prepare URL  : https://<domen>/api/click/prepare
      #   Complete URL : https://<domen>/api/click/complete
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

      # --- Payme: hozircha ishlatilmaydi (kod joyida, kalitlar bo'sh) ---
      - key: PAYME_MERCHANT_ID
        value: ""
      - key: PAYME_KEY
        value: ""
      - key: PAYME_SUBSCRIBE_ID
        value: ""
      - key: PAYME_SUBSCRIBE_KEY
        value: ""

      # --- Manzil ---
      # DIQQAT: `property: hostport` sxemasiz "host:port" qaytaradi va
      # havolalar buziladi. Domen o'zgarsa shu qiymatni yangilang.
      - key: BASE_URL
        value: "https://autoxabar-7tbz.onrender.com"
