# ============================================================
#  Render.com uchun sozlama (Blueprint)
#  https://render.com/docs/blueprint-spec
#
#  Render bu faylni o'qib, xizmatni avtomatik sozlaydi.
#  sync: false bo'lgan qiymatlarni Render o'zi so'raydi —
#  ular hech qachon repozitoriyga yozilmaydi.
# ============================================================
services:
  - type: web
    name: autoxabar
    runtime: python
    plan: free
    region: frankfurt          # O'zbekistonga eng yaqin mintaqa
    branch: main
    buildCommand: pip install -r requirements.txt
    # Bitta ishchi jarayon: fon vazifalari (yuborish sikli, avto-to'lov)
    # takrorlanmasligi uchun MUHIM. Parallellik threads orqali beriladi.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # --- Xavfsizlik ---
      - key: SECRET_KEY
        generateValue: true    # Render tasodifiy kalit yaratadi
      - key: FLASK_DEBUG
        value: "0"

      # --- Fon vazifalari ---
      - key: RUN_SCHEDULER
        value: "1"

      # --- Admin (Render so'raydi) ---
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Administrator"

      # --- Telegram (Render so'raydi) ---
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_ENGINE
        value: "auto"

      # --- Narx va moliya ---
      - key: PRICE_PER_PROFILE
        value: "5000"
      - key: TAX_PERCENT
        value: "10"
      - key: ACQUIRING_PERCENT
        value: "1.0"
      - key: TRIAL_DAYS
        value: "3"

      # --- Payme (keyinroq to'ldiriladi) ---
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_SUBSCRIBE_ID
        sync: false
      - key: PAYME_SUBSCRIBE_KEY
        sync: false

      # --- Manzil (deploydan keyin haqiqiy havola bilan almashtiring) ---
      - key: BASE_URL
        sync: false
