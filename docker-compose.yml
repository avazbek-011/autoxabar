# ============================================================
#  AutoXabar / VIPADSUZ
#
#    docker compose up -d --build     ishga tushirish
#    docker compose logs -f           loglarni ko'rish
#    docker compose down              to'xtatish (ma'lumotlar saqlanadi)
#
#  ── Arxitektura ─────────────────────────────────────────────
#
#    Mijoz --HTTPS--> Cloudflare --> host nginx --> bu to'plam
#                                    (avtoxabar.vipads.uz)
#    Click --HTTPS-----------------> host nginx --> bu to'plam
#                                    (dns.vipads.uz/api/payments/click/webhook)
#
#  To'plam faqat 127.0.0.1:8080 da tinglaydi — tashqariga serverning
#  o'z nginx'i chiqaradi. TLS va Cloudflare sozlamalari ham o'sha
#  yerda: tayyor namunalar nginx/host/ papkasida.
#
#  Mahalliy sinov uchun: http://127.0.0.1:8080
#
#  Sozlamalar .env faylidan o'qiladi. Fayl bo'lmasa ham ishga tushadi,
#  lekin SECRET_KEY har safar yangilanadi (hamma tizimdan chiqib ketadi),
#  ADMIN_PASSWORD esa faqat loglarda ko'rinadi. Serverda .env ni
#  scripts/deploy.sh o'zi yaratadi.
# ============================================================

# Loyiha nomi qat'iy: papka nomi qanday bo'lmasin, volume'lar doim
# autoxabar_autoxabar-data va autoxabar_autoxabar-uploads bo'ladi —
# papka qayta nomlansa yoki boshqa joyga clone qilinsa, compose yangi
# bo'sh volume yaratib, bazani "yo'qotib" qo'ymaydi.
name: autoxabar

services:
  autoxabar:
    build: .
    image: autoxabar:latest
    container_name: autoxabar
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      # Bu uchtasi volume'larga bog'liq — .env dagi qiymatdan ustun turadi
      DATA_DIR: /data
      SESSION_DIR: /data/sessions
      PORT: "5000"
      # Oldida proksi turibdi: X-Forwarded-* sarlavhalariga ishoniladi.
      # Konteyner ichidagi nginx real_ip orqali haqiqiy mijoz IP sini
      # aniqlab, uni sarlavha oxiriga qo'yadi — ProxyFix o'shani oladi.
      TRUSTED_PROXIES: "1"

    # Port tashqariga chiqarilmaydi: faqat nginx orqali kiriladi
    expose:
      - "5000"

    volumes:
      # Baza va Telegram sessiyalari — yo'qolsa hamma narsa yo'qoladi
      - autoxabar-data:/data
      # Foydalanuvchi yuklagan rasmlar
      - autoxabar-uploads:/app/static/uploads

    # DIQQAT: `deploy.replicas` yoki `docker compose up --scale` ishlatmang.
    # Fon vazifalari (xabar yuborish sikli) har bir nusxada qaytadan ishlaydi
    # va bitta profil bir necha marta xabar yuborib, akkaunt bloklanishi mumkin.

  nginx:
    image: nginx:1.27-alpine
    container_name: autoxabar-nginx
    restart: unless-stopped

    depends_on:
      autoxabar:
        condition: service_healthy

    ports:
      # FAQAT serverning o'zidan ko'rinadi. Tashqariga host nginx
      # chiqaradi — shuning uchun 127.0.0.1 ni olib tashlamang.
      - "127.0.0.1:${APP_PORT:-8080}:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Statik fayllarni nginx to'g'ridan-to'g'ri beradi
      - ./static:/srv/static:ro
      - autoxabar-uploads:/srv/static/uploads:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  autoxabar-data:
  autoxabar-uploads:
