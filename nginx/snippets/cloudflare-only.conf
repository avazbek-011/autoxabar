#  Kimdir server IP sini topib olsa, Cloudflare'ni (WAF, DDoS himoyasi,
#  bot filtri) butunlay chetlab o'tib to'g'ridan-to'g'ri saytga kira
#  oladi. Bu fayl shuni to'sadi.
#
#  Yoqish: server blokiga qo'shing —
#      include /etc/nginx/snippets/cloudflare-only.conf;
#
#  ⚠️ DIQQAT: yoqishdan oldin Cloudflare DNS yozuvi «Proxied» (to'q sariq
#  bulut) ekaniga ishonch hosil qiling. «DNS only» holatida yoqsangiz
#  sayt hammaga yopiladi — o'zingizga ham.
#
#  Serverga SSH orqali kirib, xatolikni shu yerdan orqaga qaytarish
#  mumkin: bu qatorni o'chirib `docker compose restart nginx`.
# ============================================================

