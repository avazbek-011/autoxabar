# ============================================================
#  Ilova va statik fayllar uchun umumiy qoidalar.
#  HTTP va HTTPS server bloklari ham shu faylni include qiladi —
#  sozlama ikki joyda takrorlanmasligi uchun.
# ============================================================

# MUHIM: app.py dagi MAX_CONTENT_LENGTH = 16 MB bilan mos bo'lishi shart.
# nginx sukut bo'yicha 1 MB dan kattasini rad etadi va foydalanuvchi
# e'longa rasm yuklay olmay qoladi (413 xatosi).
client_max_body_size 16m;

# Statik fayllarni nginx o'zi beradi — gunicorn'ning 8 ta oqimi bo'shaydi.
#   /srv/static           -> repodagi static/ (css, js, logo)
#   /srv/static/uploads   -> autoxabar-uploads volume (yuklangan rasmlar)
location /static/ {
    alias /srv/static/;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

location / {
    proxy_pass http://autoxabar:5000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $proxy_add_x_forwarded_for haqiqiy IP ni oxiriga qo'shadi. Mijoz soxta
    # X-Forwarded-For yuborsa ham oxirgi qiymat haqiqiy bo'ladi — ilova
    # tomonda ProxyFix (TRUSTED_PROXIES=1) aynan shuni oladi.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # $fwd_proto — conf.d/00-forwarded.conf dagi map. TLS host nginx'da
    # tugagani uchun bu yerdagi $scheme doim "http" bo'ladi; haqiqiy
    # sxemani oldingi proksi X-Forwarded-Proto da yuboradi.
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Click Prepare/Complete so'rovlari tez javob olishi kerak, aks holda
    # to'lov Click tomonda qo'lda tekshiruvga tushadi.
    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}
