# ============================================================
#  Cloudflare orqasida haqiqiy mijoz IP sini olish
#
#  Sayt Cloudflare'ning to'q sariq buluti ostida bo'lgani uchun nginx ga
#  hamma so'rov Cloudflare serverlaridan keladi. Bu sozlamasiz audit
#  jurnaliga va login urinishlariga Cloudflare IP lari yozilib qolardi.
#
#  `real_ip_header CF-Connecting-IP` — Cloudflare haqiqiy mijoz IP sini
#  aynan shu sarlavhada yuboradi. `set_real_ip_from` esa faqat quyidagi
#  diapazonlardan kelgan so'rovlarda shu sarlavhaga ishonishni bildiradi —
#  birov to'g'ridan-to'g'ri server IP siga soxta sarlavha yuborsa,
#  e'tiborga olinmaydi.
#
#  Diapazonlar Cloudflare tomonidan yangilanishi mumkin (kamdan-kam).
#  Yangilash:
#      curl https://www.cloudflare.com/ips-v4
#      curl https://www.cloudflare.com/ips-v6
#  Oxirgi yangilangan: 2026-09-20
# ============================================================

