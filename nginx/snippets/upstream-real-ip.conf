# ============================================================
#  Haqiqiy mijoz IP si — serverning o'z nginx'idan
#
#  Bu konteyner to'g'ridan-to'g'ri internetga qaramaydi: oldida
#  serverning o'z nginx'i (185.80.234.161) turadi va u X-Forwarded-For
#  ga haqiqiy mijoz IP sini yozib yuboradi.
#
#  Shuning uchun bu sarlavhaga FAQAT Docker ichki tarmog'idan kelgan
#  so'rovlarda ishonamiz. Birov konteyner portiga boshqa yo'l bilan
#  murojaat qilsa, soxta sarlavhasi e'tiborga olinmaydi.
#
#  Cloudflare bilan ishlash (CF-Connecting-IP) endi host nginx'ning
#  vazifasi — nginx/host/ ichidagi namunalarga qarang.
# ============================================================
set_real_ip_from 172.16.0.0/12;   # Docker bridge tarmoqlari
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.1;

real_ip_header    X-Forwarded-For;
real_ip_recursive on;
