# ============================================================
#  HTTP (80-port)
#
#  Sayt Cloudflare orqasida ishlaydi: avtoxabar.vipads.uz
#  Cloudflare «Full (strict)» rejimida serverga 443-port orqali
#  murojaat qiladi, shuning uchun 80-port faqat:
#    - server IP siga to'g'ridan-to'g'ri kelgan so'rovlar uchun
#    - Let's Encrypt tekshiruvi uchun (Cloudflare Origin Certificate
#      ishlatilsa bu ham kerak emas)
#
#  HTTPS yoqilgandan keyin pastdagi izohga qarang.
# ============================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name avtoxabar.vipads.uz _;

    # nginx versiyasini yashiramiz
    server_tokens off;

    # Cloudflare orqasida haqiqiy mijoz IP sini olish
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Let's Encrypt sertifikat tekshiruvi (Origin Certificate
    # ishlatilsa kerak emas, lekin zarar qilmaydi).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- HTTPS yoqilganda ---
    # Quyidagi "include" qatorini izohga oling va ostidagi
    # "location /" blokini izohdan chiqaring.
    #
    # DIQQAT: redirect aynan "location /" ICHIDA bo'lishi shart.
    # Server darajasiga qo'yilsa nginx uni location bloklaridan OLDIN
    # bajaradi va yuqoridagi ACME yo'li ham 301 bo'lib ketadi —
    # sertifikat yangilanmay qoladi. (Bu sinab ko'rilgan.)
    include /etc/nginx/snippets/app.conf;
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}
