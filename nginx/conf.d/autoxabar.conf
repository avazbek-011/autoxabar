# ============================================================
#  HTTP (80-port) — sukut bo'yicha faol.
#
#  HTTPS yoqilgandan keyin (autoxabar-ssl.conf.example ga qarang)
#  pastdagi `include` ni o'chirib, o'rniga izohdagi redirect ni
#  qoldiring — shunda hamma so'rov HTTPS ga yo'naltiriladi.
# ============================================================
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # nginx versiyasini yashiramiz
    server_tokens off;

    # Let's Encrypt sertifikat tekshiruvi (certbot ishlatilganda).
    # Bu yo'l HTTPS redirect'dan ham ustun bo'lishi kerak.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- HTTPS yoqilganda: shu ikki qatorni almashtiring ---
    include /etc/nginx/snippets/app.conf;
    # return 301 https://$host$request_uri;
}
