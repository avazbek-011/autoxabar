# ============================================================
#  Konteyner ichidagi nginx
#
#  Bu nginx internetga qaramaydi. U faqat serverning o'z nginx'idan
#  (127.0.0.1:8080) so'rov oladi:
#
#    Mijoz --HTTPS--> Cloudflare --> host nginx --> shu nginx --> gunicorn
#    Click --HTTPS--------------->  host nginx --> shu nginx --> gunicorn
#
#  Shuning uchun bu yerda TLS ham, Cloudflare sozlamalari ham yo'q —
#  ular host nginx'da. Namunalar: nginx/host/
#
#  Bu nginx ikki ish qiladi:
#    1) /static/ ni o'zi beradi (gunicorn oqimlari bo'shaydi)
#    2) qolganini gunicorn'ga uzatadi, haqiqiy IP va sxemani saqlab
# ============================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Host nginx yuborgan X-Forwarded-For dan haqiqiy mijoz IP sini olish
    include /etc/nginx/snippets/upstream-real-ip.conf;

    include /etc/nginx/snippets/app.conf;
}
