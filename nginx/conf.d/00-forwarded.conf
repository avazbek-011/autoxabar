# ============================================================
#  Oldingi proksidan kelgan sxemani saqlash
#
#  Bu konteyner faqat HTTP tinglaydi (TLS host nginx'da tugaydi),
#  shuning uchun $scheme bu yerda doim "http" bo'ladi. Agar shu
#  qiymatni ilovaga uzatsak, url_for(..., _external=True) http://
#  manzil yasaydi va Click'dan qaytish havolasi buziladi.
#
#  Shuning uchun host nginx yuborgan X-Forwarded-Proto ni o'tkazamiz,
#  u bo'lmasa $scheme ga qaytamiz. Faqat "http" yoki "https" qabul
#  qilinadi — boshqa har qanday qiymat e'tiborga olinmaydi.
#
#  `map` http konteksti uchun: conf.d/*.conf nginx.conf ning http{}
#  bloki ichiga qo'shiladi, fayl nomi 00- bilan boshlangani uchun
#  boshqa sozlamalardan oldin o'qiladi.
# ============================================================
map $http_x_forwarded_proto $fwd_proto {
    default   $scheme;
    "https"   https;
    "http"    http;
}
